<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincón Latino</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    
    <div class="wrapper">
        <div class="wrapper">
            <nav id="menu">
                <a href="#inicio" class="logo">Rincón Latino</a>
                <div class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
                <ul id="nav-links">
                    <li><a href="#">DULCES</a></li>
                    <li><a href="#">SALADOS</a></li>
                    <li><a href="#">BEBIDAS</a></li>
                    <li><a href="#">PAÍSES</a></li>
                </ul>

                <div class="search">
                    <input type="text" placeholder="Buscar" id="search-input">
                </div>

                <div class="nav-icons">
                    <a href="#" title="Mi Perfil"><i class="fa-solid fa-circle-user"></i></a>
                    <a href="#" title="Carrito"><i class="fas fa-shopping-cart"></i></a>
                </div>
            </nav>
        </div>

        <div class="start" id="inicio">
            <img src="MEDIA/IMG/header.webp" alt="header Image">
            <div class="start-text">
                <h1>El sabor de Latinoamérica</h1>
                <h3>Sabores auténticos de toda Latinoamérica reunidos en un solo lugar.</h3>
                <p>C. de Chile, 3, Chamartín</p>
            </div>
        </div>
    </div>

    <section id="actividades">
        <div class="container">
            <h2 class="section-title">𓎩 Más vendidos 𓎩</h2>
                
            <!-- Te dejo lo que usé para una web del año pasado.
             FIJATE QUE ESTEN LAS CLASES EN MINISCULAS PQ SINO NO FUNCIONA Y ME DA TOC :) -->

            <div class="card-grid">
                <a href="#" class="cards-comida">
                <div class="img-snack">
                    <img src="MEDIA/IMG/Frugele-Ambrosoli-Candy-430g-Chile.webp" alt="snacks">
                </div>
                    <div class="info-snack">
                        <h3 class="nombre-snack">NOMBRE</h3>
                        <span class="precio">dinerito</span>
                        <p>Este dulce está rico lorem lorem lorem y eso</p>
                    </div>
                </a>
            </div>
    </section>
</body>
